<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyBuddy - Profile</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <span>📚</span>
            <h2>StudyBuddy</h2>
        </div>

        <nav>

            <a href="dashboard.html" class="sidebar-link">
                🏠 Dashboard
            </a>

            <a href="groups.html" class="sidebar-link">
                🔍 Find Groups
            </a>

            <a href="my-groups.html" class="sidebar-link">
                👥 My Groups
            </a>

            <a href="create-group.html" class="sidebar-link">
                ➕ Create Group
            </a>

            <a href="profile.html"
               class="sidebar-link active">
                👤 Profile
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="index.html" class="sidebar-link">
                🚪 Logout
            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>My Profile 👤</h1>
                <p>Manage your StudyBuddy account.</p>
            </div>

        </header>


        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileName">
                Student
            </h2>

            <p id="profileEmail">
                student@example.com
            </p>


            <form id="profileForm">

                <div class="form-group">

                    <label>Name</label>

                    <input
                            type="text"
                            id="name"
                            required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                            type="email"
                            id="email"
                            required>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Department</label>

                        <input
                                type="text"
                                id="department">

                    </div>


                    <div class="form-group">

                        <label>Year</label>

                        <select id="year">

                            <option value="1">
                                1st Year
                            </option>

                            <option value="2">
                                2nd Year
                            </option>

                            <option value="3">
                                3rd Year
                            </option>

                            <option value="4">
                                4th Year
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label>New Password</label>

                    <input
                            type="password"
                            id="password"
                            placeholder="Enter new password">

                </div>


                <button
                        type="submit"
                        class="btn-primary">

                    Update Profile

                </button>

            </form>

            <p id="profileMessage"></p>

        </div>

    </main>

</div>

<script src="js/profile.js"></script>

</body>
</html>
